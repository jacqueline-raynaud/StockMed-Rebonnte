name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name : Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Compilation debug
        run: ./gradlew assembleDebug

      - name: run tests unit
        run: ./gradlew testDebugUnitTest

      - name: Analyse statique
        run: ./gradlew lintDebug

      - name: Cache SonarQube
        uses : actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Envoyer l'analyse à SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Sans -Dsonar.qualitygate.wait : l'analyse remonte et le tableau de
        # bord se met a jour, mais la porte qualite ne fait plus echouer le
        # build. A remettre quand JaCoCo sera branche et la couverture reelle.
        # jacocoTestReport avant sonar : le scanner lit le XML de couverture
        # produit par cette tache. Sans elle, SonarCloud rapporte 0 %.
        run: ./gradlew jacocoTestReport sonar --info

      - name: save reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reports-Tests-Android
          path: |
            app/build/reports/
            app/build/test-results/

  # Job separe : l'emulateur prend plusieurs minutes a demarrer et n'a rien a
  # partager avec l'analyse. En parallele, il ne retarde pas le retour sur la
  # compilation et les tests unitaires.
  instrumented-tests:

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Sans acceleration materielle, l'emulateur demarre en quelques dizaines
      # de minutes au lieu de quelques dizaines de secondes.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tests instrumentés
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Aligne sur compileSdk / targetSdk.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Rapports des tests instrumentés
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reports-Instrumented-Tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
