name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Compilation debug
        run: ./gradlew assembleDebug

      - name: run tests unit
        run: ./gradlew testDebugUnitTest

      - name: Analyse statique
        run: ./gradlew lintDebug

      - name: save reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reports-Tests-Android
          path: |
            app/build/reports/
            app/build/test-results/

  instrumented-tests:

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # acceleration matérielle émulateur.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tests instrumentés
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      # La couverture d'interface ne peut etre mesuree que sur un appareil. Ce
      # `.ec` est la seule chose que le job d'analyse ne peut pas reproduire
      # lui-meme : il voyage donc en artefact, et lui seul.
      - name: Couverture des tests instrumentés
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Coverage-Instrumented
          path: app/build/outputs/code_coverage/debugAndroidTest/connected
          if-no-files-found: warn

      - name: Rapports des tests instrumentés
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reports-Instrumented-Tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  # Analyse et couverture
  # `!cancelled()` et non `success()` : si l'emulateur echoue l'analyse remonte
  sonar:

    needs: instrumented-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          # SonarCloud a besoin de l'historique complet pour dater les lignes.
          fetch-depth: 0

      - name: Configurer Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Récupérer la couverture des tests instrumentés
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Coverage-Instrumented
          path: app/build/outputs/code_coverage/debugAndroidTest/connected

      - name: Cache SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Envoyer l'analyse à SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Sans -Dsonar.qualitygate.wait : l'analyse remonte et le tableau de
        # bord se met a jour, mais la porte qualite ne fait plus echouer le
        # build. A remettre quand la couverture aura atteint le seuil.
        #
        # jacocoTestReport avant sonar : le scanner lit le XML produit par cette
        # tache. Elle relance les tests unitaires — c'est ce qui produit le
        # `.exec` et les classes compilees, moins couteux a refaire qu'a
        # transporter.
        run: ./gradlew jacocoTestReport sonar --info

      - name: Rapport de couverture fusionné
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Coverage-Report
          path: app/build/reports/jacoco/
